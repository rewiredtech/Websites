<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rewired Tech Services | Redirecting...</title>
  
  <!-- Automatic Redirect to Homepage -->
  <meta http-equiv="refresh" content="0; url=https://rewiredwireless.com/">
  <link rel="canonical" href="https://rewiredwireless.com/">

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-blue: #0014FF;
      --primary-blue-hover: #000FBF;
      --bg-white: #FFFFFF;
      --bg-light-gray: #F9F9F9;
      --text-dark: #222222;
      --text-muted: #555555;
      --border-color: #EAEAEA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      color: var(--text-dark);
      background-color: var(--bg-white);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--bg-white);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 20px;
      text-align: center;
    }

    .logo-container img {
      max-height: 60px;
      width: auto;
    }

    .redirect-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .redirect-card {
      background-color: var(--bg-light-gray);
      border: 1px solid var(--border-color);
      padding: 40px 25px;
      border-radius: 12px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .redirect-card i.spinner {
      font-size: 2.5rem;
      color: var(--primary-blue);
      margin-bottom: 20px;
    }

    .redirect-card h2 {
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    .redirect-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .cta-btn {
      background-color: var(--primary-blue);
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.3s ease;
    }

    .cta-btn:hover {
      background-color: var(--primary-blue-hover);
    }

    footer {
      background-color: var(--text-dark);
      color: #ccc;
      text-align: center;
      padding: 20px;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="REWIRED BUSINESS LOGO.png" alt="Rewired Tech Services Logo">
    </div>
  </header>

  <div class="redirect-container">
    <div class="redirect-card">
      <i class="fa-solid fa-spinner fa-spin spinner"></i>
      <h2>Connecting to Rewired...</h2>
      <p>If you are not automatically redirected within a few seconds, click the button below.</p>
      <a href="https://rewiredwireless.com/" class="cta-btn">
        <i class="fa-solid fa-arrow-right"></i> Go to Main Site
      </a>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Rewired Tech Services. All rights reserved.</p>
  </footer>

</body>
</html>
